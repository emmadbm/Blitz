<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blitz | AI Data Analytics</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <!-- ================= HEADER ================= -->

        <header class="logo">

            <h1>⚡ BLITZ</h1>

            <p>AI-Powered Data Analytics Platform</p>

            <span>Upload • Analyze • Visualize • Predict</span>

        </header>

        <!-- ================= UPLOAD ================= -->

        <section class="upload-section">

            <div class="upload-box">

                <div class="upload-icon">
                    📂
                </div>

                <h2>Upload Dataset</h2>

                <p id="fileName">
                    Drag & Drop your CSV or Excel file
                </p>

                <label for="datasetFile" class="upload-btn">

                    Browse Files

                </label>

                <input
                    type="file"
                    id="datasetFile"
                    accept=".csv,.xlsx,.xls"
                    hidden>

            </div>

        </section>

        <!-- ================= CONTROLS ================= -->

        <section class="control-card">

            <div class="controls">

                <div class="input-group">

                    <label for="algorithm">

                        Algorithm

                    </label>

                    <select id="algorithm">

                        <option value="">Select Algorithm</option>

                        <option value="linear regression">
                            Linear Regression
                        </option>

                        <option value="logistic regression">
                            Logistic Regression
                        </option>

                        <option value="decision tree">
                            Decision Tree
                        </option>

                        <option value="random forest">
                            Random Forest
                        </option>

                        <option value="k-means">
                            K-Means
                        </option>

                    </select>

                </div>

                <div class="input-group">

                    <label for="targetColumn">

                        Target Column

                    </label>

                    <select id="targetColumn">

                        <option value="">
                            Select Target
                        </option>

                    </select>

                </div>

            </div>

        </section>

        <!-- ================= BUTTON ================= -->

        <section class="analyze">

            <button id="analyzeBtn">

                Analyze Dataset

            </button>

        </section>

        <!-- ================= LOADING ================= -->

        <section id="loading" class="hidden">

            <h3>

                Analyzing Dataset...

            </h3>

        </section>

        <section id="results" class="results-dashboard">

    <!-- Dataset Summary -->
    <div id="datasetCard" class="dashboard-card"></div>

    <!-- Health Report -->
    <div id="healthCard" class="dashboard-card"></div>

    <!-- Preprocessing -->
    <div id="preprocessingCard" class="dashboard-card"></div>

    <!-- Machine Learning -->
    <div id="mlCard" class="dashboard-card"></div>

    <!-- AI Insights -->
    <div id="aiCard" class="dashboard-card"></div>

    <!-- Charts -->
    <div id="chartsCard" class="dashboard-card"></div>

</section>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
